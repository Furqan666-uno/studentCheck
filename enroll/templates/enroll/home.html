<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Django Ajax CRUD</title>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center alert alert-danger"> Django based view ajax bootstrap 5 CRUD project </h2>
        
        <div class="row">
            <div class="col-sm-4">
                <h4 class="text-center alert alert-info"> Add/Update Student </h4>
                
                <form action="" method="post"> <!-- post bcz here we are sending data to server -->
                    {% csrf_token %}
                    <input type="hidden" name="stuid" id="stuid" /> <!-- this form input will be hidden and will be used to store id of students -->
                    {{form.as_p}} <!-- here p is <p> -->
                    <input type="button" class="btn btn-success" id="btnsave" value="Save">
                </form>

                <div id="msg" class="alert alert-danger" style="display:none"> <!-- display:none prevents an empty alert to be on the page -->
                    
                </div>
            </div>

            <div class="col-sm-7">
                <h4 class="text-center alert alert-info"> Show Student Info </h4>
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Password</th>
                            <th scope="col">Action</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        {% for st in stu %}
                        <tr>
                            <td scope="col">{{st.id}}</td>
                            <td scope="col">{{st.name}}</td>
                            <td scope="col">{{st.email}}</td>
                            <td scope="col">{{st.password}}</td>
                            <td>
                                <input type="button" data-sid="{{st.id}}" value="Edit" class="btn btn-warning btn-sm btn-edit">
                                <!-- data-sid= used to get data from user input -->
                            </td>
                            <td>
                                <input type="button" data-sid="{{st.id}}" value="Delete" class="btn btn-danger btn-sm btn-del">
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
{% include 'enroll/ajax.html' %}
</html>
